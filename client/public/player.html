<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b10" />
    <title>Now Playing</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090b10;
        color: #f5f6fa;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% -20%, rgb(91 76 176 / 22%), transparent 55%),
          #090b10;
      }

      .page {
        width: min(100% - 40px, 1040px);
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 48px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -0.03em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 11px;
        background: linear-gradient(145deg, #a78bfa, #6d5bd0);
        color: white;
        font-size: 16px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #a7aab8;
        font-size: 12px;
        font-weight: 600;
      }

      .status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #8b79ee;
        content: "";
      }

      .heading {
        margin-bottom: 22px;
      }

      .eyebrow {
        margin: 0 0 9px;
        color: #a99cf2;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 40px);
        font-weight: 720;
        letter-spacing: -0.045em;
      }

      .description {
        margin: 10px 0 0;
        color: #9da1af;
        font-size: 14px;
        line-height: 1.6;
      }

      .player-frame {
        overflow: hidden;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 16px;
        background: #000;
        box-shadow: 0 28px 80px rgb(0 0 0 / 45%);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .note {
        margin: 16px 2px 0;
        color: #777c8b;
        font-size: 12px;
        line-height: 1.6;
      }

      @media (max-width: 600px) {
        .page {
          width: min(100% - 28px, 1040px);
          padding-top: 22px;
        }

        .topbar {
          margin-bottom: 36px;
        }

        .player-frame {
          aspect-ratio: 16 / 10;
          border-radius: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Now Playing home">
          <span class="brand-mark" aria-hidden="true">▶</span>
          <span>Now Playing</span>
        </a>
        <span class="status">Ready to watch</span>
      </header>

      <section aria-labelledby="page-title">
        <div class="heading">
          <p class="eyebrow">Featured video</p>
          <h1 id="page-title">Sit back and enjoy</h1>
          <p class="description">Your video is ready below. Use the player controls to start watching.</p>
        </div>

        <div class="player-frame">
          <iframe
            src="https://strtape.tech/e/9Bmd6m1aPAiyG8/"
            title="Featured video player"
            allow="autoplay; fullscreen"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
        <p class="note">The video is hosted by a third-party player. Playback availability depends on that service.</p>
      </section>
    </main>
  </body>
</html>
