---
- name: Create project directory on remote server
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Bundle project files into a single compressed archive
  delegate_to: localhost
  become: false
  command:
    cmd: "tar --exclude=node_modules --exclude=.git --exclude=dist -czf {{ playbook_dir }}/.payload.tar.gz -C {{ playbook_dir }}/.. docker-compose.yml docker client server"

- name: Upload and unpack project bundle on EC2
  unarchive:
    src: "{{ playbook_dir }}/.payload.tar.gz"
    dest: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"

- name: Clean up local temporary bundle
  delegate_to: localhost
  become: false
  file:
    path: "{{ playbook_dir }}/.payload.tar.gz"
    state: absent

- name: Generate .env
  copy:
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0600'
    content: |
      NODE_ENV=production
      PORT=5000
      MONGO_URI={{ mongo_uri }}
      DB_NAME=kwikr
      JWT_SECRET={{ jwt_secret }}
      CLIENT_URL=http://{{ ansible_host }},http://{{ ansible_host }}:{{ app_port }},http://localhost
      APP_PORT={{ app_port }}
      NAGIOS_PORT={{ nagios_port }}
      NAGIOSADMIN_USER={{ nagios_user }}
      NAGIOSADMIN_PASS={{ nagios_pass }}
      TIMEZONE={{ timezone }}

- name: pull Nagiosimage
  command:
    cmd: docker compose pull nagios
    chdir: "{{ app_dir }}"
  register: pull_res
  retries: 3
  delay: 5
  until: pull_res.rc == 0

- name: Build application containers sequentially
  command:
    cmd: docker compose build --parallel=false
    chdir: "{{ app_dir }}"

- name: Start Docker Compose stack
  command:
    cmd: docker compose up -d
    chdir: "{{ app_dir }}"

- name: Kwikr Backend Health check
  uri:
    url: "http://localhost:{{ app_port }}/api/health"
    method: GET
    status_code: 200
    return_content: true
  register: health_result
  until: health_result.status == 200 and 'ok' in health_result.content
  retries: 15
  delay: 5

- name: Deployment Success Banner
  debug:
    msg:
      - "=========================================================="
      - "KWIKR APP SUCCESSFULLY DEPLOYED VIA TERRAFORM & ANSIBLE!"
      - "=========================================================="
      - "Storefront URL:       http://{{ ansible_host }}:{{ app_port }}"
      - "API Health Check:     http://{{ ansible_host }}:{{ app_port }}/api/health"
      - "Nagios Dashboard:     http://{{ ansible_host }}:{{ nagios_port }}/nagios/"
      - "=========================================================="
