define host {
    use                     generic-host
    host_name               kwikr-client
    alias                   Kwikr Frontend
    address                 client
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define host {
    use                     generic-host
    host_name               kwikr-server
    alias                   Kwikr Backen
    address                 server
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define hostgroup {
    hostgroup_name          kwikr-services
    alias                   Kwikr Application Stack
    members                 kwikr-client, kwikr-server
}

define service {
    use                     generic-service
    host_name               kwikr-client
    service_description     Frontend_HTTP_Check
    check_command           check_http!-p 80 -u /
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define service {
    use                     generic-service
    host_name               kwikr-client
    service_description     Reverse_Proxy_API_Health
    check_command           check_http!-p 80 -u /api/health -s "ok"
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define service {
    use                     generic-service
    host_name               kwikr-server
    service_description     Direct_Backend_Health
    check_command           check_http!-p 5000 -u /api/health -s "ok"
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

