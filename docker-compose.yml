services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: kwikr-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI="${MONGO_URI}"
      - DB_NAME="${DB_NAME:-kwikr}"
      - JWT_SECRET="${JWT_SECRET}"
      - CLIENT_URL="${CLIENT_URL}"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5000/api/health | grep -q 'ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kwikr-network
  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    container_name: kwikr-client
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - kwikr-network
  nagios:
    image: jasonrivers/nagios:latest
    container_name: kwikr-nagios
    restart: unless-stopped
    environment:
      - NAGIOSADMIN_USER=${NAGIOSADMIN_USER}
      - NAGIOSADMIN_PASS=${NAGIOSADMIN_PASS}
      - NAGIOS_TIMEZONE=${TIMEZONE}
    volumes:
      - ./docker/nagios/kwikr.cfg:/opt/nagios/etc/conf.d/kwikr.cfg:ro
    ports:
      - "${NAGIOS_PORT:-8080}:80"
    depends_on:
      - server
      - client
    networks:
      - kwikr-network

networks:
  kwikr-network:
    driver: bridge
